default:
  tags:
    - dev-gps

stages:
  - build
  - publish
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: "1"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive

.build-image:
  stage: build
  interruptible: true
  image: docker:28-cli
  services:
    - docker:28-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-$IMAGE_ARCH"
    - BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - >
      docker build
      --platform "$TARGET_PLATFORM"
      --provenance=false
      --build-arg BRANCH="$CI_COMMIT_REF_NAME"
      --build-arg COMMIT="$CI_COMMIT_SHA"
      --build-arg TIME="$BUILD_TIME"
      --tag "$IMAGE"
      --file Dockerfile
      .
    - docker push "$IMAGE"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

build:image:x86_64:
  extends: .build-image
  variables:
    IMAGE_ARCH: x86_64
    TARGET_PLATFORM: linux/amd64

build:image:arm64:
  extends: .build-image
  tags:
    - aarch64
  variables:
    IMAGE_ARCH: arm64
    TARGET_PLATFORM: linux/arm64

publish-image:
  stage: publish
  interruptible: true
  image: docker:28-cli
  needs:
    - build:image:x86_64
    - build:image:arm64
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - AMD64_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-x86_64"
    - ARM64_IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-arm64"
    - |
      tags="$CI_COMMIT_REF_SLUG $CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        tags="$tags latest"
      fi
      for tag in $tags; do
        image="$CI_REGISTRY_IMAGE:$tag"
        docker manifest create "$image" "$AMD64_IMAGE" "$ARM64_IMAGE"
        docker manifest push --purge "$image"
        manifest="$(docker manifest inspect "$image")"
        printf '%s\n' "$manifest" | grep -q '"architecture": "amd64"'
        printf '%s\n' "$manifest" | grep -q '"architecture": "arm64"'
      done
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

deploy:
  stage: deploy
  image: alpine:3.20
  variables:
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    LOCAL_IMAGE: door-service
    DEPLOY_BRANCH: develop
  environment:
    name: dev
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$DEPLOY_SSH_KEY" && ssh-add "$DEPLOY_SSH_KEY"
    - mkdir -p ~/.ssh && ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" sh -s <<EOF
      set -eu
      cd "$DEPLOY_PATH"
      docker pull "$IMAGE"
      docker tag "$IMAGE" "$LOCAL_IMAGE"
      docker compose up -d
      sleep 20
      docker compose ps --format '{{.State}}' | grep -q running || {
        docker compose logs --tail 60
        exit 1
      }
      docker run --rm --entrypoint /bin/sh "$LOCAL_IMAGE" -c 'test -x /app/doorservice'
      EOF
  rules:
    - if: $DEPLOY_HOST == null
      when: never
    - if: $CI_COMMIT_BRANCH == $DEPLOY_BRANCH
